<style>

body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #f0f4f8, #ffffff);
    margin: 0;
    padding: 30px;
}


/* HEADER */
.title {
    text-align: center;
    color: #1e293b;
    margin-bottom: 40px;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 1px;
}


/* CARD */
.line-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 30px;
    margin-bottom: 30px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    transition: transform 0.25s, box-shadow 0.25s;
    border: 1px solid #e2e8f0;
}

.line-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
}

/* LINE TITLE */
.line-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 20px;
    color: #0f172a;
    border-bottom: 2px solid #e0e7ff;
    padding-bottom: 6px;
}

/* HOUR LABEL GRID */
.hour-labels {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
    gap: 10px;
    margin-bottom: 10px;
}

.hour-labels span {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: #475569;
}

/* INPUT GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
    gap: 10px;
    margin-bottom: 15px;
}

/* INPUT */
input[type=number] {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    background: #f8fafc;
    transition: all 0.2s;
}

input[type=number]:focus {
    outline: none;
    border-color: #2563eb;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    transform: scale(1.05);
}

input.locked {
    background: #e2e8f0 !important;
    border-color: #94a3b8 !important;
    color: #475569;
}

/* TOTAL BOX */
.total-box {
    margin-top: 12px;
    padding: 12px 16px;
    background: linear-gradient(90deg, #e0f2fe, #f0f9ff);
    border-radius: 10px;
    font-weight: 600;
    color: #1e293b;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #bae6fd;
    font-size: 16px;
}

.total-value {
    font-size: 22px;
    color: #0ea5e9;
    font-weight: 800;
}

/* ===================================== */
/* OPERATOR ALERT SYSTEM */
/* ===================================== */

#alertBtn{
    position:fixed;
    bottom:30px;
    right:30px;
    width:70px;
    height:70px;
    border:none;
    border-radius:50%;
    cursor:pointer;

    background:linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    color:white;
    font-size:30px;

    box-shadow:

    z-index:9998;
    transition:.25s;
}

#alertBtn:hover{
    transform:scale(1.08);
}

#alertModal{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.55);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:99999;
}

.alert-box{

    width:550px;
    max-width:92%;

    background:white;

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 30px 80px rgba(0,0,0,.25);
}

.alert-header{

    background:linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    color:white;

    padding:20px;

    font-size:18px;
    font-weight:700;
}

.alert-body{
    padding:20px;
}

.alert-body label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
    color:#0f172a;
}

.alert-body select,

    width:100%;

    border:1px solid #cbd5e1;

    border-radius:12px;

    padding:12px;

    margin-bottom:16px;

    font-size:14px;
}

.alert-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

.alert-cancel{
    border:none;
    padding:12px 18px;
    border-radius:10px;

    background:#e2e8f0;

    .grid, .hour-labels {

    }
    .line-title {

    }
    input[type=number] {

            <input type="number" name="hour4" value="{{ obj.hour4|default_if_none:'' }}" {% if obj.hour4 %}disabled class="locked"{% endif %}>

            <input type="number" name="hour6" value="{{ obj.hour6|default_if_none:'' }}" {% if obj.hour6 %}disabled class="locked"{% endif %}>

<!-- REPORT ISSUE BUTTON -->

<button id="alertBtn">
💬
</button>

<div id="alertModal">

    <div class="alert-box">

        <div class="alert-header">
            Report Production Issue
        </div>

        <div class="alert-body">

            <form id="alertForm">

                {% csrf_token %}

                <label>Line</label>

                <select name="line">

                    {% for line, form, obj in forms_data %}
                    <option value="{{ line }}">
                        {{ line }}
                    </option>
                    {% endfor %}

                </select>

                <input
                    type="hidden"
                    name="shift"
                    value="{{ shift }}"
                >

                <label>Severity</label>

                <select name="severity">
                    <option value="info">
                        Information
                    </option>

                    <option value="warning">
                        Warning
                    </option>

                    <option value="critical">
                        Critical
                    </option>
                </select>

                <label>Issue Description</label>

                <textarea
                    name="message"
                    rows="5"
                    placeholder="Describe the issue..."
                    required
                ></textarea>

                <div class="alert-actions">

                    <button
                        type="button"
                        class="alert-cancel"
                        onclick="closeAlertModal()"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="alert-send"
                    >
                        Send Alert
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script>
document.querySelectorAll(".line-form").forEach(form => {
    const inputs = form.querySelectorAll("input[type=number]");
    const totalDiv = form.querySelector(".total-value");

    const recalcTotal = () => {
        let sum = 0;
        inputs.forEach(i => {
            let val = parseFloat(i.value);
            if(!isNaN(val)) sum += val;
        });
        totalDiv.textContent = sum;
    };

    recalcTotal();

    inputs.forEach(input => {
        input.addEventListener("change", async () => {
            if(!input.value || input.disabled) return;

            const fd = new FormData(form);

            // ✅ ALWAYS append shift
            fd.append("shift", "{{ shift }}");

            try{
                const res = await fetch("",{
                    method:"POST",
                    headers:{
                        "X-CSRFToken": form.querySelector("[name=csrfmiddlewaretoken]").value,
                        "X-Requested-With":"XMLHttpRequest"
                    },
                    body:fd
                });

                const data = await res.json();

                if(data.error){
                    alert(data.error);
                    input.value="";
                    recalcTotal();
                    return;
                }

                if(data.success){
                    input.disabled = true;
                    input.classList.add("locked");
                    recalcTotal();
                }

            }catch(err){
                console.error(err);
            }
        });
    });
});
</script>

<!-- ========================= -->
<!-- RESET / SHIFT NOTIFICATION SYSTEM -->
<!-- ========================= -->
<script>
let lastEventSeen = null;

// ✅ POLLING INTERVAL UPDATED TO 30 SECONDS
setInterval(() => {
    fetch("/jobcard/get-active-shift/")
        .then(res => res.json())
        .then(data => {

            if (!data.last_reset) return;

            if (!lastEventSeen) {
                lastEventSeen = data.last_reset;
                return;
            }

            if (data.last_reset !== lastEventSeen) {
                lastEventSeen = data.last_reset;
                showNotification(data);
            }
        })
        .catch(() => {});
}, 30000); // 30 seconds now


function showNotification(data) {

    // Prevent duplicate banners
    if (document.getElementById("reset-banner")) return;

    const banner = document.createElement("div");
    banner.id = "reset-banner";

    let title = "System Update";
    let message = "Please reload the page to continue.";
    let icon = "⚠️";

    if (data.event_type === "shift_start") {
        title = `Shift Started: ${data.shift}`;
        message = data.line
            ? `Supervisor started ${data.shift} shift for ${data.line}`
            : `Supervisor started ${data.shift} shift`;
        icon = "🔄";
    }

    if (data.event_type === "line_reset") {
        title = `Line Reset: ${data.line}`;
        message = `Supervisor reset line ${data.line}`;
        icon = "🔁";
    }

    banner.innerHTML = `
        <div class="reset-content">
            <div class="reset-icon">${icon}</div>

            <div class="reset-text">
                <strong>${title}</strong>
                <span>${message}</span>
            </div>

            <button class="reset-btn" onclick="location.reload()">Reload</button>
        </div>
    `;

    document.body.appendChild(banner);
}
</script>

<script>

const alertBtn =
document.getElementById("alertBtn");

const alertModal =
document.getElementById("alertModal");

alertBtn.onclick = () => {
    alertModal.style.display = "flex";
};

function closeAlertModal(){
    alertModal.style.display = "none";
}

document
.getElementById("alertForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const formData =
    new FormData(this);

    try{

        const response =
        await fetch(
            "/jobcard/submit-alert/",
            {
                method:"POST",
                headers:{
                    "X-CSRFToken":
                    document.querySelector(
                        "[name=csrfmiddlewaretoken]"
                    ).value
                },
                body:formData
            }
        );

        const data =
        await response.json();

        if(data.success){

            alert(
                "Issue reported successfully."
            );

            this.reset();

            closeAlertModal();
        }
        else{

            alert(
                data.error ||
                "Failed to submit."
            );
        }

    }catch(err){

        console.error(err);

        alert(
            "Unable to submit issue."
        );
    }

});

</script>
