<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password</title>

<style>

body{
    margin:0;
    padding:0;

    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;

    background:linear-gradient(135deg,#f8fafc,#e2e8f0);

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

/* ---------- CARD ---------- */

.card{

    background:white;

    width:100%;
    max-width:460px;

    padding:40px;

    border-radius:18px;

    box-shadow:0 12px 35px rgba(0,0,0,.12);

    animation:fadeIn .35s ease;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ---------- TITLE ---------- */

h2{

    text-align:center;

    margin-top:0;
    margin-bottom:10px;

    color:#1e293b;
}

.subtitle{

    text-align:center;

    color:#64748b;

    margin-bottom:30px;
}

/* ---------- FORM ---------- */

form{

    display:flex;

    flex-direction:column;

    gap:18px;
}

label{

    font-weight:600;

    color:#334155;
}

input{

    padding:12px 15px;

    border:1px solid #cbd5e1;

    border-radius:10px;

    font-size:15px;

    transition:.25s;
}

input:focus{

    outline:none;

    border-color:#2563eb;

    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

/* ---------- BUTTONS ---------- */

.button-group{

    display:flex;

    justify-content:space-between;

    margin-top:10px;
}

.back-btn{

    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:12px 20px;

    border-radius:10px;

    text-decoration:none;

    background:#64748b;

    color:white;

    font-weight:600;

    transition:.25s;
}

.back-btn:hover{

    background:#475569;

    transform:translateY(-2px);
}

.reset-btn{

    border:none;

    background:#2563eb;

    color:white;

    padding:12px 24px;

    border-radius:10px;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.25s;
}

.reset-btn:hover{

    background:#1d4ed8;

    transform:translateY(-2px);

    box-shadow:0 10px 20px rgba(37,99,235,.25);
}

</style>
</head>
<body>

<div class="card">

    <h2>🔑 Reset Password</h2>

    <div class="subtitle">
        Create a new password for
        <strong>{{ user.username }}</strong>
    </div>

    <form method="POST">

        {% csrf_token %}

        <label>New Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter new password"
            required
        >

        <div class="button-group">

            <a href="{% url 'jobcard:user_management' %}" class="back-btn">
                ← Cancel
            </a>

            <button type="submit" class="reset-btn">
                Reset Password
            </button>

        </div>

    </form>

</div>

</body>
</html>
