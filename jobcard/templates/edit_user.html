<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit User</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    background:#f4f7fb;
    min-height:100vh;
    color:#1e293b;
}

/* HEADER */

.header{
    background:#ffffff;
    padding:25px 40px;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.header h1{
    font-size:24px;
    font-weight:700;
}

.header p{
    margin-top:4px;
    color:#64748b;
    font-size:13px;
}

/* CONTAINER */

.container{
    max-width:700px;
    margin:50px auto;
    padding:0 20px;
}

/* CARD */

.card{
    background:#ffffff;
    border-radius:18px;
    border:1px solid #e2e8f0;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
    padding:35px;
}

/* SECTION TITLE */

.section-title{
    font-size:13px;
    color:#64748b;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-bottom:25px;
}

/* FORM */

.form-group{
    margin-bottom:22px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
    color:#334155;
}

.form-group input,
.form-group select{

    width:100%;

    padding:13px 15px;

    border:1px solid #cbd5e1;

    border-radius:10px;

    font-size:14px;

    transition:.2s;
}

.form-group input:focus,
.form-group select:focus{

    outline:none;

    border-color:#2563eb;

    box-shadow:0 0 0 3px rgba(37,99,235,.15);

}

/* USER INFO BOX */

.user-info{

    background:#eff6ff;

    border:1px solid #bfdbfe;

    padding:18px;

    border-radius:12px;

    margin-bottom:25px;
}

.user-info strong{
    color:#1d4ed8;
}

/* BUTTONS */

.actions{

    display:flex;

    justify-content:flex-end;

    gap:12px;

    margin-top:30px;
}

.cancel-btn{

    padding:12px 20px;

    border:none;

    border-radius:10px;

    background:#e2e8f0;

    color:#334155;

    text-decoration:none;

    font-weight:600;

    transition:.2s;
}

.cancel-btn:hover{

    background:#cbd5e1;

}

.save-btn{

    padding:12px 22px;

    border:none;

    border-radius:10px;

    background:linear-gradient(90deg,#2563eb,#3b82f6);

    color:white;

    font-weight:600;

    cursor:pointer;

    transition:.2s;
}

.save-btn:hover{

    transform:translateY(-2px);

    box-shadow:0 10px 25px rgba(37,99,235,.25);

}

/* FOOTER */

.footer{

    text-align:center;

    margin:40px;

    color:#94a3b8;

    font-size:12px;
}

</style>

</head>
<body>

<div class="header">

    <div>
        <h1>Edit User</h1>
        <p>Developer Administration • Update User Information</p>
    </div>

</div>

<div class="container">

<div class="card">

<div class="section-title">
User Details
</div>

<div class="user-info">

<strong>Editing Account:</strong>

{{ user.username }}

</div>

<form method="POST">

{% csrf_token %}

<div class="form-group">

<label>Username</label>

<input
type="text"
name="username"
value="{{ user.username }}"
required>

</div>

<div class="form-group">

<label>Email Address</label>

<input
type="email"
name="email"
value="{{ user.email }}">

</div>

<div class="form-group">

<label>User Role</label>

<select name="role">

{% for value,label in roles %}

<option
value="{{ value }}"
{% if profile.role == value %}selected{% endif %}>

{{ label }}

</option>

{% endfor %}

</select>

</div>

<div class="actions">

<a
href="{% url 'jobcard:user_management' %}"
class="cancel-btn">

Cancel

</a>

<button
type="submit"
class="save-btn">

Save Changes

</button>

</div>

</form>

</div>

</div>

<div class="footer">

© Digital Jobcard System • Developer Administration Portal

</div>

</body>
</html>
