<h2>Edit User</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="username" value="{{ user.username }}">
    <input type="email" name="email" value="{{ user.email }}">

    <select name="role">
        {% for value,label in roles %}
            <option value="{{ value }}"
                {% if profile.role == value %}selected{% endif %}>
                {{ label }}
            </option>
        {% endfor %}
    </select>

    <button type="submit">Update</button>
</form>
