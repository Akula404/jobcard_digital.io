<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Change Password | Digital Jobcard</title>

<style>

*{
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at 20% 20%,
            #1e3a8a 0%,
            transparent 40%
        ),
        radial-gradient(
            circle at 80% 80%,
            #0f172a 0%,
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #0b1220,
            #0f172a
        );

    color:#e5e7eb;
}

.card{

    width:420px;

    background:rgba(17,24,39,0.85);

    backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:16px;

    padding:38px;

    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

h1{

    text-align:center;

    font-size:20px;

    margin-bottom:8px;

    color:white;
}

.subtitle{

    text-align:center;

    color:#94a3b8;

    font-size:12px;

    margin-bottom:25px;
}

.form-group{

    margin-bottom:18px;
}

label{

    display:block;

    margin-bottom:7px;

    font-size:13px;

    color:#cbd5e1;
}

input{

    width:100%;

    padding:13px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.1);

    background:rgba(255,255,255,.05);

    color:white;

    font-size:14px;
}

input:focus{

    outline:none;

    border-color:#38bdf8;

    box-shadow:
        0 0 0 3px
        rgba(56,189,248,.15);
}

.help{

    margin-top:6px;

    font-size:11px;

    color:#64748b;
}

.errorlist{

    list-style:none;

    padding:0;

    margin:6px 0;

    color:#fca5a5;

    font-size:12px;
}

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #38bdf8
        );

    color:white;

    font-size:14px;

    font-weight:600;

    cursor:pointer;
}

button:hover{

    transform:translateY(-2px);

    box-shadow:
        0 10px 25px
        rgba(37,99,235,.3);
}

.back{

    display:block;

    text-align:center;

    margin-top:18px;

    color:#94a3b8;

    font-size:12px;

    text-decoration:none;
}

.back:hover{

    color:#38bdf8;
}

</style>

</head>

<body>

<div class="card">

    <h1>Change Password</h1>

    <div class="subtitle">
        Update your Digital Jobcard System password
    </div>

    <form method="POST">

        {% csrf_token %}

        {% for field in form %}

            <div class="form-group">

                {{ field.label_tag }}

                {{ field }}

                {% if field.help_text %}
                    <div class="help">
                        {{ field.help_text|safe }}
                    </div>
                {% endif %}

                {% for error in field.errors %}

                    <ul class="errorlist">
                        <li>{{ error }}</li>
                    </ul>

                {% endfor %}

            </div>

        {% endfor %}

        <button type="submit">
            Change Password
        </button>

    </form>

    <a
        href="{% url 'jobcard:role_redirect' %}"
        class="back">

        Cancel

    </a>

</div>

</body>

</html>
