<!DOCTYPE html>
<html>

<head>

<title>Verify Login</title>

<style>

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f4f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 15px;
    width: 400px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.1);
}

h2 {
    margin-bottom: 10px;
}

.info {
    color: #64748b;
    margin-bottom: 25px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    text-align: center;
    font-size: 24px;
    letter-spacing: 8px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.error {
    background: #fee2e2;
    color: #b91c1c;
    padding: 10px;
    border-radius: 7px;
    margin-bottom: 15px;
}

</style>

</head>

<body>

<div class="card">

<h2>Verify Your Login</h2>

<p class="info">
A 6-digit verification code has been sent
to your registered email address.
</p>

{% if error %}
<div class="error">
    {{ error }}
</div>
{% endif %}

<form method="POST">

{% csrf_token %}

<input
    type="text"
    name="otp"
    maxlength="6"
    inputmode="numeric"
    autocomplete="one-time-code"
    pattern="[0-9]{6}"
    required
    autofocus
>

<button type="submit">
    Verify Code
</button>

</form>

</div>

</body>
</html>
