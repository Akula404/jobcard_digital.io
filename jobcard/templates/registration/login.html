<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Login | Digital Jobcard</title>

<style>

/* =========================
   BASE
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at 20% 20%, #1e3a8a 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, #0f172a 0%, transparent 40%),
        linear-gradient(135deg,#0b1220,#0f172a);
    color:#e5e7eb;
}

/* =========================
   LOGIN CARD
========================= */
.card{
    width:420px;
    background:rgba(17,24,39,0.85);
    backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    padding:38px;
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

/* =========================
   HEADER
========================= */
.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    font-size:20px;
    font-weight:700;
    color:#ffffff;
}

.header p{
    font-size:12px;
    color:#94a3b8;
    margin-top:6px;
}

/* =========================
   INPUTS
========================= */
input{
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.05);
    color:white;
    font-size:14px;
    transition:0.2s;
}

input::placeholder{
    color:#94a3b8;
}

input:focus{
    outline:none;
    border-color:#38bdf8;
    box-shadow:0 0 0 3px rgba(56,189,248,0.15);
}

/* =========================
   BUTTON
========================= */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#2563eb,#38bdf8);
    color:white;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(37,99,235,.3);
}

/* =========================
   FOOTER
========================= */
.footer{
    text-align:center;
    margin-top:18px;
    font-size:11px;
    color:#64748b;
}

</style>

</head>

<body>

<div class="card">

    <div class="header">
        <h1>Digital Jobcard System</h1>
        <p>Secure Access Portal</p>
    </div>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
            required>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <button type="submit">
            Sign In
        </button>

    </form>

    <div class="footer">
        © Realtime Monitoring & Digital Jobcard System
    </div>

</div>

</body>
</html>
