<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Password Changed | Digital Jobcard</title>

<style>

*{
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        linear-gradient(
            135deg,
            #0b1220,
            #0f172a
        );

    color:#e5e7eb;
}

.card{

    width:420px;

    background:
        rgba(17,24,39,.9);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:16px;

    padding:40px;

    text-align:center;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.5);
}

h1{

    color:#38bdf8;

    font-size:21px;

    margin-bottom:12px;
}

p{

    color:#94a3b8;

    font-size:13px;

    line-height:1.6;
}

a{

    display:inline-block;

    margin-top:22px;

    padding:12px 24px;

    border-radius:9px;

    background:#2563eb;

    color:white;

    text-decoration:none;

    font-size:13px;
}

a:hover{

    background:#1d4ed8;
}

</style>

</head>

<body>

<div class="card">

    <h1>Password Changed</h1>

    <p>
        Your password has been changed successfully.
    </p>

    <p>
        You can continue using the Digital Jobcard System.
    </p>

    <a href="{% url 'jobcard:role_redirect' %}">
        Continue
    </a>

</div>

</body>

</html>
