<!DOCTYPE html>
<html>
<head>
    <title>Access Denied</title>

    <style>
        body{
            font-family:Segoe UI,sans-serif;
            background:#f8fafc;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:20px;
            text-align:center;
            width:500px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        h1{
            color:#dc2626;
        }

        p{
            color:#64748b;
        }

        a{
            display:inline-block;
            margin-top:20px;
            padding:12px 20px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:10px;
        }
    </style>

</head>
<body>

<div class="card">

    <h1>Invalid Request</h1>

    <p>
    The request could not be processed.
    </p>

</div>

</body>
</html>
