<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Access Denied</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.box {
    text-align: center;
    background: #111827;
    padding: 40px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    max-width: 420px;
}

h1 {
    color: #ef4444;
    margin-bottom: 10px;
}

p {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 25px;
}

a.button {
    display: inline-block;
    padding: 10px 18px;
    background: #3b82f6;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 14px;
    transition: 0.2s;
}

a.button:hover {
    background: #2563eb;
}
</style>

</head>

<body>

<div class="box">
    <h1>Access Denied</h1>
    <p>You must be logged in to access this page.</p>

    <a class="button" href="/jobcard/login/">Go to Login</a>
</div>

</body>
</html>
